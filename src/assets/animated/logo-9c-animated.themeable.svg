<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
<title id="t">Sekoya Solutions</title>
<style>.logo *{transform-box:fill-box}
.logo .anim-trunk{transform-origin:50% 100%;animation:trunk-grow .5s cubic-bezier(.3,.7,.35,1) .1s both}
.logo .root{stroke-dasharray:1 2;animation:root-draw var(--dur) cubic-bezier(.3,.6,.3,1) var(--d) both}
.logo .node{transform-origin:50% 50%;animation:node-pop .38s cubic-bezier(.2,.9,.3,1.25) var(--nd) both}
.logo .chevron{animation:chev-in .62s cubic-bezier(.2,.8,.25,1) var(--d) both}
.logo #ring{stroke-dasharray:1 2;animation:ring-draw .95s cubic-bezier(.45,.1,.2,1) 2.4s both}
@keyframes trunk-grow{from{opacity:0;transform:scaleY(0)}35%{opacity:1}to{opacity:1;transform:scaleY(1)}}
@keyframes root-draw{0%{opacity:0;stroke-dashoffset:1}1%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
@keyframes node-pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes chev-in{from{opacity:0;transform:translateY(-46px)}60%{opacity:1}to{opacity:1;transform:translateY(0)}}
@keyframes ring-draw{0%{opacity:0;stroke-dashoffset:1}1%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.logo .anim-trunk,.logo .root,.logo .node,.logo .chevron,.logo #ring{animation:none!important}}
/* THEMEABLE: set these on the parent element when the SVG is INLINED in the page (CSS variables do not cross <img>).
   dark : --logo-canopy:#22c08a; --logo-gold:#e8d3a8; --logo-roots:#9dbdcc;
   light: --logo-canopy:#16927a; --logo-gold:#a8893f; --logo-roots:#4a6577; */
.logo #roots{stroke:var(--logo-roots,#9dbdcc)}
.logo .node{fill:var(--logo-roots,#9dbdcc)}
.logo #trunk{fill:var(--logo-gold,#e8d3a8)}
.logo .chevron{fill:var(--logo-canopy,#22c08a);stroke:var(--logo-canopy,#22c08a)}
.logo #ring{stroke:var(--logo-gold,#e8d3a8)}</style>
